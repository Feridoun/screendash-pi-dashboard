# ~/.vnc/tigervnc.conf -- per-user config for the screendash admin VNC
# session (display :1, port 5901), read by the tigervncserver@:1.service
# systemd template (see /etc/tigervnc/vncserver-config-defaults).
$geometry = "1366x768";
$depth = "24";
$localhost = "no";
$SecurityTypes = "VncAuth";
$desktopName = "screendash-admin";
1;
