# Installed to /etc/systemd/system/tigervncserver@:1.service.d/override.conf
#
# Caps the admin VNC session so a runaway Chromium is OOM-killed inside this
# cgroup rather than taking down flutter-pi or the rest of the system. This is
# a Pi 3B with ~1 GB of RAM and flutter-pi alone holds ~165 MB; the memory gate
# in docs/dashboard-plan.md (M3) exists for the same reason.
#
# Raise MemoryMax if you actually need heavy browsing here, but understand the
# trade: the wall display is the thing that must not die.
[Service]
MemoryMax=350M
MemorySwapMax=200M
